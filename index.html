<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friend Call</title>
<style>
:root{--bg:#0f1220;--panel:#181c30;--line:#2a3050;--text:#eef0fa;--mute:#9aa2c8;--accent:#7c8cff;--danger:#ff6b7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select,input{font:inherit}
#lobby{max-width:440px;margin:0 auto;padding:40px 20px}
h1{font-size:28px;margin:0 0 6px}
p.sub{color:var(--mute);margin:0 0 24px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn.off{background:var(--danger)}
#go{width:100%;margin-top:22px}
.note{font-size:12px;color:var(--mute);margin-top:14px;line-height:1.5}
#call{display:none;height:100%;flex-direction:column}
#grid{flex:1;display:grid;gap:8px;padding:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));grid-auto-rows:minmax(0,1fr);min-height:0}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:140px}
.tile video{width:100%;height:100%;object-fit:cover}
.tile.me video{transform:scaleX(-1)}
.tag{position:absolute;left:8px;bottom:8px;background:#000a;padding:3px 8px;border-radius:6px;font-size:12px}
#subs{position:absolute;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 12px;pointer-events:none}
.sub{background:#000c;padding:8px 14px;border-radius:10px;max-width:760px;font-size:18px;line-height:1.35;text-align:center}
.sub b{color:var(--accent);font-size:13px;display:block}
.sub small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.sub.interim{opacity:.6}
#bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:var(--panel);border-top:1px solid var(--line)}
#bar select{width:auto;padding:10px}
#log{display:none;position:absolute;right:0;top:0;bottom:60px;width:min(340px,90%);background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;font-size:14px}
#log div{margin-bottom:10px}
#log small{color:var(--mute);display:block}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:9}
</style>
</head>
<body>
<div id="toast"></div>

<div id="lobby">
  <h1>Friend Call</h1>
  <p class="sub">Free video calls with live translation. English, Suomi, Español.</p>
  <label>Your name</label>
  <input id="name" placeholder="Name" maxlength="24">
  <label>Language I speak</label>
  <select id="speak"><option value="en">English</option><option value="fi">Suomi</option><option value="es">Español</option></select>
  <label>Language I want subtitles in</label>
  <select id="read"><option value="en">English</option><option value="fi">Suomi</option><option value="es">Español</option></select>
  <label>Room code (make one up and share it, or enter your friend's)</label>
  <input id="room" placeholder="e.g. pizza-night" maxlength="40">
  <button class="btn" id="go">Join / create room</button>
  <p class="note">Use Chrome or Edge for live speech recognition. Video goes directly between you and your friends. Your browser will ask for camera and microphone access.</p>
</div>

<div id="call">
  <div id="grid" style="position:relative"></div>
  <div id="subs"></div>
  <div id="log"></div>
  <div id="bar">
    <button class="btn ghost" id="bMic">Mic on</button>
    <button class="btn ghost" id="bCam">Camera on</button>
    <button class="btn ghost" id="bCap">Subtitles on</button>
    <button class="btn ghost" id="bSpeak">Read aloud off</button>
    <button class="btn ghost" id="bLog">Transcript</button>
    <select id="readLive"><option value="en">Subtitles: English</option><option value="fi">Subtitles: Suomi</option><option value="es">Subtitles: Español</option></select>
    <button class="btn ghost" id="bShare">Copy invite link</button>
    <button class="btn off" id="bLeave">Leave</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const LANGS = { en:{sr:'en-US',tts:'en-US'}, fi:{sr:'fi-FI',tts:'fi-FI'}, es:{sr:'es-ES',tts:'es-ES'} };

// Free STUN servers. If some friends can't connect, add a TURN server here
// (e.g. a free account from metered.ca or Cloudflare Calls) like:
// {urls:'turn:HOST:443', username:'USER', credential:'PASS'}
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' }
]};

let peer, localStream, rec, recWanted = false;
let me = { name:'', speak:'en', read:'en', id:null };
let captionsOn = true, speakAloud = false, micOn = true, camOn = true;
const conns = {}; // peerId -> {id,name,lang,data,call}
const ent = id => conns[id] || (conns[id] = { id, name:'Friend' });

function toast(msg, ms=4000){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }

// Pre-fill from invite link and saved settings
try{
  const s = JSON.parse(localStorage.getItem('fc')||'{}');
  if(s.name) $('name').value=s.name; if(s.speak) $('speak').value=s.speak; if(s.read) $('read').value=s.read;
}catch{}
if(location.hash.length>1) $('room').value = decodeURIComponent(location.hash.slice(1));

$('go').onclick = async () => {
  me.name = $('name').value.trim() || 'Me';
  me.speak = $('speak').value; me.read = $('read').value;
  const room = $('room').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g,'-');
  if(!room){ toast('Enter a room code'); return; }
  try{ localStorage.setItem('fc', JSON.stringify({name:me.name,speak:me.speak,read:me.read})); }catch{}
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480}, audio:{echoCancellation:true,noiseSuppression:true} });
  }catch(e){ toast('Camera/microphone blocked. Allow access and try again.'); return; }
  prewarmTranslators();
  $('lobby').style.display='none'; $('call').style.display='flex';
  $('readLive').value = me.read;
  addTile('me', localStream, me.name + ' (you)', true);
  history.replaceState(null,'','#'+encodeURIComponent(room));
  openPeer(room, true);
};

function openPeer(room, tryHost){
  const hostId = 'friendcall-v1-' + room;
  peer = tryHost ? new Peer(hostId, { config:ICE }) : new Peer({ config:ICE });
  peer.on('open', id => {
    me.id = id;
    if(!tryHost) connectTo(hostId);
    startRec();
  });
  peer.on('connection', c => setupData(c));
  peer.on('call', call => { call.answer(localStream); setupCall(call); });
  peer.on('error', e => {
    if(e.type === 'unavailable-id'){ peer.destroy(); openPeer(room, false); } // room exists: join as guest
    else if(e.type === 'peer-unavailable'){ /* a friend left; ignore */ }
    else toast('Connection problem: ' + e.type);
  });
}

function connectTo(id){
  if(id === me.id || (conns[id] && conns[id].data)) return;
  const c = peer.connect(id, { reliable:true });
  setupData(c);
  const call = peer.call(id, localStream);
  if(call) setupCall(call);
}

function setupData(c){
  const e = ent(c.peer); e.data = c;
  c.on('open', () => c.send({ t:'hello', name:me.name, lang:me.speak, peers:Object.keys(conns).filter(k=>conns[k].data) }));
  c.on('data', m => {
    if(m.t === 'hello'){
      e.name = m.name; e.lang = m.lang; setTag(c.peer, m.name);
      (m.peers||[]).forEach(p => connectTo(p));
    } else if(m.t === 'say'){ onSay(e, m); }
  });
  c.on('close', () => removePeer(c.peer));
}

function setupCall(call){
  const e = ent(call.peer); e.call = call;
  call.on('stream', s => addTile(call.peer, s, e.name));
  call.on('close', () => removePeer(call.peer));
}

function removePeer(id){
  const t = document.getElementById('t-'+id); if(t) t.remove();
  if(conns[id]){ try{conns[id].call&&conns[id].call.close()}catch{} delete conns[id]; }
}

function addTile(id, stream, label, mine){
  if(document.getElementById('t-'+id)) return;
  const d = document.createElement('div'); d.className='tile'+(mine?' me':''); d.id='t-'+id;
  const v = document.createElement('video'); v.autoplay=true; v.playsInline=true; v.srcObject=stream; if(mine) v.muted=true;
  const g = document.createElement('div'); g.className='tag'; g.textContent=label||'Friend';
  d.append(v,g); $('grid').appendChild(d);
}
function setTag(id,name){ const t=document.querySelector('#t-'+CSS.escape(id)+' .tag'); if(t) t.textContent=name; }

// ---------- Speech recognition (runs in your own browser) ----------
function startRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Live subtitles for your own speech need Chrome or Edge. You can still see friends\' subtitles.', 7000); return; }
  recWanted = true;
  rec = new SR(); rec.lang = LANGS[me.speak].sr; rec.continuous = true; rec.interimResults = true;
  rec.onresult = ev => {
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r = ev.results[i], text = r[0].transcript.trim();
      if(!text) continue;
      if(r.isFinal){
        broadcast({ t:'say', text, lang:me.speak });
        showLine('me', me.name, text, null, false);
        logLine(me.name, text, null);
      } else showLine('me', me.name, text, null, true);
    }
  };
  rec.onend = () => { if(recWanted && micOn) setTimeout(()=>{ try{rec.start()}catch{} }, 150); };
  rec.onerror = e => { if(e.error==='not-allowed' || e.error==='service-not-allowed'){ recWanted=false; toast('Speech recognition was blocked.'); } };
  try{ rec.start(); }catch{}
}
function broadcast(m){ Object.values(conns).forEach(e => { if(e.data && e.data.open) e.data.send(m); }); }

// ---------- Translation ----------
const trCache = {};
async function getTranslator(from, to){
  const key = from+'>'+to;
  if(key in trCache) return trCache[key];
  trCache[key] = null;
  try{
    if('Translator' in self){
      const av = await Translator.availability({ sourceLanguage:from, targetLanguage:to });
      if(av !== 'unavailable') trCache[key] = await Translator.create({ sourceLanguage:from, targetLanguage:to });
    }
  }catch{ delete trCache[key]; }
  return trCache[key] || null;
}
function prewarmTranslators(){ Object.keys(LANGS).forEach(l => { if(l!==me.read) getTranslator(l, me.read); }); }
async function translate(text, from, to){
  if(from === to) return text;
  const tr = await getTranslator(from, to);
  if(tr){ try{ return await tr.translate(text); }catch{} }
  try{ // free fallback (limited daily quota)
    const r = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to);
    const j = await r.json(); return j.responseData.translatedText;
  }catch{ return text; }
}

async function onSay(e, m){
  const out = await translate(m.text, m.lang, me.read);
  const orig = m.lang === me.read ? null : m.text;
  showLine(e.id, e.name, out, orig, false);
  logLine(e.name, out, orig);
  if(speakAloud && 'speechSynthesis' in window){
    const u = new SpeechSynthesisUtterance(out); u.lang = LANGS[me.read].tts; speechSynthesis.speak(u);
  }
}

// ---------- Subtitles & transcript ----------
function showLine(id, name, text, orig, interim){
  if(!captionsOn) return;
  let el = document.getElementById('s-'+id);
  if(!el){ el = document.createElement('div'); el.id='s-'+id; $('subs').appendChild(el); }
  el.className = 'sub' + (interim?' interim':'');
  el.innerHTML = '<b></b><span></span>' + (orig?'<small></small>':'');
  el.querySelector('b').textContent = name;
  el.querySelector('span').textContent = text;
  if(orig) el.querySelector('small').textContent = orig;
  clearTimeout(el._h); el._h = setTimeout(()=>el.remove(), interim?3000:7000);
}
function logLine(name, text, orig){
  const d = document.createElement('div');
  d.innerHTML = '<strong></strong> <span></span>' + (orig?'<small></small>':'');
  d.querySelector('strong').textContent = name + ':';
  d.querySelector('span').textContent = text;
  if(orig) d.querySelector('small').textContent = orig;
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}

// ---------- Controls ----------
$('bMic').onclick = () => {
  micOn = !micOn; localStream.getAudioTracks().forEach(t=>t.enabled=micOn);
  $('bMic').textContent = micOn ? 'Mic on' : 'Mic off'; $('bMic').classList.toggle('off',!micOn);
  if(!micOn){ try{rec&&rec.stop()}catch{} } else if(recWanted){ try{rec&&rec.start()}catch{} }
};
$('bCam').onclick = () => {
  camOn = !camOn; localStream.getVideoTracks().forEach(t=>t.enabled=camOn);
  $('bCam').textContent = camOn ? 'Camera on' : 'Camera off'; $('bCam').classList.toggle('off',!camOn);
};
$('bCap').onclick = () => { captionsOn=!captionsOn; $('bCap').textContent = captionsOn?'Subtitles on':'Subtitles off'; if(!captionsOn) $('subs').innerHTML=''; };
$('bSpeak').onclick = () => { speakAloud=!speakAloud; $('bSpeak').textContent = speakAloud?'Read aloud on':'Read aloud off'; if(!speakAloud) speechSynthesis.cancel(); };
$('bLog').onclick = () => { const l=$('log'); l.style.display = l.style.display==='block'?'none':'block'; };
$('readLive').onchange = e => { me.read = e.target.value; prewarmTranslators(); };
$('bShare').onclick = async () => {
  try{ await navigator.clipboard.writeText(location.href); toast('Invite link copied. Send it to your friends.'); }
  catch{ toast(location.href, 8000); }
};
$('bLeave').onclick = () => {
  recWanted=false; try{rec&&rec.stop()}catch{}
  try{peer&&peer.destroy()}catch{}
  localStream && localStream.getTracks().forEach(t=>t.stop());
  location.reload();
};
</script>
</body>
</html>
